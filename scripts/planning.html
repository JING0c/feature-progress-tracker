<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目规划</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#382632;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{height:62px;background:white;border-bottom:1px solid #efc6d9;display:flex;align-items:center;gap:24px;padding:0 max(24px,calc((100vw - 1120px)/2))}header strong{font-size:15px;white-space:nowrap}a{color:#832d51;text-decoration:none;font-size:14px}a:hover{text-decoration:underline}.back{margin-left:auto}main{max-width:1120px;margin:0 auto;padding:42px 24px 60px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:28px;align-items:start}.heading{margin-bottom:26px}h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em}.heading p{margin:0;color:#704e60;font-size:14px;line-height:1.7}.chat{border:1px solid #eab6cd;background:#fff;border-radius:14px;overflow:hidden}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fce9f2;border-bottom:1px solid #efd0de;font-size:14px;font-weight:700}.chat-head span{font-size:12px;color:#7b5a69;font-weight:400}#messages{min-height:340px;max-height:58vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}.message{max-width:90%;border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#f8cae4;color:#3d2533}.message.assistant{align-self:flex-start;background:#f2f5e8;color:#243b2d}.message .role{font-size:12px;font-weight:700;margin-bottom:4px;opacity:.8}.message .body{white-space:pre-wrap}.welcome{margin:auto;text-align:center;color:#725a66;line-height:1.8;font-size:14px}.welcome strong{font-size:18px;color:#482b38}.composer{border-top:1px solid #f0dae4;padding:16px 20px}textarea{display:block;width:100%;min-height:95px;resize:vertical;border:1px solid #d7bbc8;border-radius:9px;padding:12px;font:inherit;font-size:14px;line-height:1.6;color:#382632}textarea:focus{outline:2px solid #ea6993;outline-offset:2px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}button{cursor:pointer;font:inherit;border:0;border-radius:8px;padding:10px 15px}.send{background:#832d51;color:white;font-weight:700}.secondary{background:#f9eaf1;color:#71354f}.controls{display:flex;gap:8px;flex-wrap:wrap}.status{color:#745867;font-size:12px}.status.error{color:#a32645}.side{border:1px solid #e5cfda;border-radius:12px;padding:20px;background:#fff}.side h2{font-size:15px;margin:0 0 15px}.side p,.side li{font-size:13px;line-height:1.75;color:#6e5360}.side ol{padding-left:20px;margin:0}.side li+li{margin-top:9px}.side hr{border:0;border-top:1px solid #f1e4ea;margin:18px 0}.side strong{color:#3b2932}.plan-document{margin:0 0 26px;border:1px solid #eab6cd;border-radius:14px;background:#fff;overflow:hidden}.plan-document[hidden]{display:none}.plan-header{padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fce9f2;border-bottom:1px solid #efd0de}.plan-header h2{margin:0;font-size:18px}.plan-header p{margin:0;color:#745867;font-size:12px}.plan-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.plan-content{padding:24px;line-height:1.8;overflow-wrap:anywhere}.plan-content h1,.plan-content h2,.plan-content h3{margin:1.2em 0 .4em;color:#482b38}.plan-content h1{font-size:23px}.plan-content h2{font-size:18px}.plan-content h3{font-size:16px}.plan-content p{margin:.45em 0;white-space:pre-wrap}.plan-content ul{padding-left:1.4em}.plan-content li{margin:.3em 0}.plan-content pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f3f5;padding:12px;border-radius:8px}button:disabled{opacity:.55;cursor:wait}@media(max-width:760px){main{padding:28px 16px}.layout{grid-template-columns:1fr}.side{order:-1}.message{max-width:100%}header{padding:0 16px}h1{font-size:26px}}
</style></head><body><header><strong>功能进度看板</strong><a class="back" href="/">返回功能看板</a></header><main><div class="heading"><h1>项目规划</h1><p>从一个想法开始，和智能体逐步讨论需求、拆分功能，并整理验收标准。</p></div><section id="plan-document" class="plan-document" aria-label="项目规划书" hidden><div class="plan-header"><div><h2>项目规划书</h2><p>由规划对话生成，请审阅并确认未决事项。</p></div><div class="plan-actions"><button class="secondary" type="button" id="copy-plan">复制规划书</button><button class="secondary" type="button" id="download-plan">下载 Markdown</button></div></div><article id="plan-content" class="plan-content"></article></section><div class="layout"><section class="chat" aria-label="项目规划对话"><div class="chat-head">规划对话 <span>由本机 Codex 提供回复</span></div><div id="messages" aria-live="polite"></div><form id="form" class="composer"><textarea id="input" placeholder="例如：我想做一个管理个人待办事项的小工具……" aria-label="输入项目想法" required></textarea><div class="actions"><span id="status" class="status">对话保存在当前浏览器中</span><div class="controls"><button class="secondary" id="draft" type="button">完成对话，生成规划书</button><button class="secondary" id="generate-ledger" type="button">生成功能台账</button><button class="secondary" id="save-ledger" type="button">保存到看板</button><button class="secondary" id="copy" type="button">复制对话</button><button class="secondary" id="clear" type="button">清空对话</button><button class="send" type="submit">发送</button></div></div></form></section><aside class="side"><h2>一起梳理项目</h2><ol><li>说明目标、使用者和主要场景。</li><li>通过对话澄清范围、约束和未确定事项。</li><li>拆分可验收功能，梳理依赖、风险和优先级。</li><li>完成对话后生成并审阅项目规划书。</li><li>生成并审阅功能台账，然后保存到看板。</li></ol><hr><p><strong>当前是规划草稿。</strong>只有点击保存并确认后才会更新台账；原文件会保留备份，未审核的功能不会标记为完成。</p></aside></div></main><script>
const TOKEN='__PLANNING_TOKEN__',KEY='project-planning:__PLANNING_KEY__',PLAN_KEY=KEY+':document';let messages=[],planText='',planRequested=false;try{let saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))messages=saved.filter(m=>['user','assistant'].includes(m.role)&&typeof m.content==='string')}catch(e){}try{planText=localStorage.getItem(PLAN_KEY)||''}catch(e){}const list=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input'),status=document.getElementById('status'),send=form.querySelector('.send');function save(){try{localStorage.setItem(KEY,JSON.stringify(messages))}catch(e){status.textContent='浏览器无法保存对话，请及时复制';status.className='status error'}}function showPlan(text,scroll=false){planText=text;const section=document.getElementById('plan-document'),article=document.getElementById('plan-content');section.hidden=!text;article.replaceChildren();if(!text)return;let listNode=null,inCode=false,codeNode=null;for(const line of text.split('\n')){if(/^\s*```/.test(line)){inCode=!inCode;if(inCode){codeNode=document.createElement('pre');article.append(codeNode)}else codeNode=null;listNode=null;continue}if(inCode){codeNode.textContent+=line+'\n';continue}const heading=line.match(/^(#{1,3})\s+(.+)/),bullet=line.match(/^\s*[-*]\s+(.+)/);if(heading){const h=document.createElement('h'+heading[1].length);h.textContent=heading[2].replace(/\*\*/g,'');article.append(h);listNode=null}else if(bullet){if(!listNode){listNode=document.createElement('ul');article.append(listNode)}const li=document.createElement('li');li.textContent=bullet[1].replace(/\*\*/g,'');listNode.append(li)}else{listNode=null;if(!line.trim())continue;const p=document.createElement('p');p.textContent=line.replace(/\*\*/g,'');article.append(p)}}if(scroll)section.scrollIntoView({behavior:'smooth',block:'start'})}showPlan(planText);function render(){list.replaceChildren();if(!messages.length){const w=document.createElement('div');w.className='welcome';w.innerHTML='<strong>先聊聊你的想法</strong><br>不需要一次想清楚，我们可以边聊边整理。';list.append(w);return}for(const m of messages){const box=document.createElement('div'),role=document.createElement('div'),body=document.createElement('div');box.className='message '+m.role;role.className='role';role.textContent=m.role==='user'?'你':'规划助手';body.className='body';body.textContent=m.content;box.append(role,body);list.append(box)}list.scrollTop=list.scrollHeight}render();form.addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value)return;messages.push({role:'user',content:value});input.value='';save();render();send.disabled=true;document.getElementById('generate-ledger').disabled=true;document.getElementById('save-ledger').disabled=true;document.getElementById('draft').disabled=true;input.disabled=true;document.getElementById('clear').disabled=true;status.className='status';status.textContent='智能体正在思考，请稍候…';try{const r=await fetch('/api/planning',{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':TOKEN},body:JSON.stringify({messages})});const data=await r.json();if(!r.ok)throw Error(data.error||'回复失败');messages.push({role:'assistant',content:data.reply});save();render();if(planRequested){showPlan(data.reply,true);try{localStorage.setItem(PLAN_KEY,data.reply)}catch(e){status.className='status error';status.textContent='浏览器无法保存规划书，请复制或下载。'}}if(status.className!=='status error')status.textContent=planRequested?'规划书已生成，请查看上方内容。':'对话保存在当前浏览器中'}catch(err){messages.pop();input.value=value;save();render();status.className='status error';status.textContent=err.message||'连接失败，请重试'}finally{planRequested=false;send.disabled=false;document.getElementById('generate-ledger').disabled=false;document.getElementById('save-ledger').disabled=false;document.getElementById('draft').disabled=false;input.disabled=false;document.getElementById('clear').disabled=false}});document.getElementById('draft').addEventListener('click',()=>{if(!messages.length){status.className='status error';status.textContent='请先描述项目想法，再整理规划。';input.focus();return}planRequested=true;input.value='请根据我们已有的对话，生成一份完整、可阅读的项目规划书，使用 Markdown，包含项目目标、用户与场景、范围与不做事项、分层功能和验收标准、优先级与依赖、风险、待确认事项和必要时的实施阶段。区分已确认内容与假设；不要编造工期。';form.requestSubmit()});document.getElementById('generate-ledger').addEventListener('click',()=>{if(!messages.length){status.className='status error';status.textContent='请先描述项目想法，再生成功能台账。';input.focus();return}input.value='请根据之前的对话，输出可直接保存的 Markdown 功能台账，包含大功能、小功能及必要的更细功能。每个功能点写明状态、验收、优先级、依赖、执行 Agent、实现证据、审核 Agent、评分和问题；未审核项保持未勾选，保留未确认事项，不使用代码围栏。';form.requestSubmit()});
document.getElementById('save-ledger').addEventListener('click',async()=>{const candidate=[...messages].reverse().find(m=>m.role==='assistant'&&/^##\s+大功能\s+/m.test(m.content));if(!candidate){status.className='status error';status.textContent='尚未找到功能台账，请先点击“生成功能台账”。';return}let content=candidate.content;const fenced=content.match(/```(?:markdown|md)?\s*\n([\s\S]*?)```/i);if(fenced&&/^##\s+大功能\s+/m.test(fenced[1]))content=fenced[1];try{const r=await fetch('/api/ledger/info',{cache:'no-store'}),meta=await r.json();if(!r.ok)throw Error(meta.error||'无法读取当前台账');if(!confirm('将最近生成的功能台账保存到：\n'+meta.path+'\n\n现有台账将被替换并保留备份。请先审阅对话中的台账内容。继续吗？'))return;const saveButton=document.getElementById('save-ledger');saveButton.disabled=true;try{const res=await fetch('/api/ledger/save',{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':TOKEN},body:JSON.stringify({content,revision:meta.revision})});const data=await res.json();if(!res.ok)throw Error(data.error||'保存失败');status.className='status';status.textContent='已保存 '+data.count+' 个功能点，旧台账备份：'+data.backup+'。点击“返回功能看板”查看。'}finally{saveButton.disabled=false}}catch(e){status.className='status error';status.textContent=e.message||'保存失败'}});
document.getElementById('clear').addEventListener('click',()=>{if(messages.length&&!confirm('清空当前浏览器中的规划对话和已生成的规划书？'))return;messages=[];save();try{localStorage.removeItem(PLAN_KEY)}catch(e){}showPlan('');render();status.className='status';status.textContent='对话已清空'});document.getElementById('copy-plan').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(planText);status.className='status';status.textContent='已复制规划书'}catch(e){status.className='status error';status.textContent='复制失败，请选择规划书中的文字复制'}});document.getElementById('download-plan').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([planText],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='项目规划书.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(messages.map(m=>(m.role==='user'?'你':'规划助手')+'：\n'+m.content).join('\n\n'));status.textContent='已复制对话'}catch(e){status.className='status error';status.textContent='复制失败，请手动选择文字'}});
</script></body></html>
