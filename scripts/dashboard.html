<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>功能进度看板</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#403a2e;background:#f5f2e9}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #ded7c5;background:#faf8f2;padding:18px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;gap:15px;font-size:14px}header strong{letter-spacing:.08em}#message{color:#756c59}#message[data-error=true]{color:#9b4941}main{max-width:1120px;margin:auto;padding:44px 24px 80px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#8b7c5e;font-weight:700}h1{font-size:32px;margin:10px 0}p{line-height:1.6}.intro{color:#7b725f;font-size:14px;margin:0 0 30px}.overview{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#eae3d1;border:1px solid #d9cfb7;border-radius:14px;padding:20px 24px;margin-bottom:30px}.overview strong{font-size:25px}.overview span{font-size:13px;color:#70644f}.overview .hint{margin-left:auto}.board{display:grid;gap:18px}.lane{border:1px solid #d6c9ad;border-radius:14px;padding:22px;background:var(--lane)}.lane{--lane:#e9e1cc}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.badge{font-size:11px;border-radius:4px;padding:3px 7px;background:#eee6d4;color:#62563d}.badge.done{background:#dce2c9;color:#455837}.badge.working{background:#e9d4a8;color:#674d1f}.badge.issue{background:#edd3c1;color:#804d34}.badge.dispute{background:#e2d3c9;color:#714d49}.badge.review{background:#e5dcc9;color:#6e5c3c}.lane-head{display:flex;gap:12px;align-items:baseline;margin-bottom:14px}.lane h2{font-size:17px;margin:0}.lane-count{font-size:12px;color:#766b59}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:10px}.card{background:#fffdf7;border:1px solid #d7ccb6;border-radius:9px;overflow:hidden}.card.status-new{background:#f6f0e2;border-color:#d8cbb3}.card.status-done{background:#e5ead8;border-color:#bac9a8}.card.status-working{background:#f2e1ba;border-color:#d3b77c}.card.status-review{background:#e9dece;border-color:#cdbba1}.card.status-blocked{background:#f1dbcd;border-color:#d5aa92}.card.status-cancelled{background:#e8e5dd;border-color:#c9c4b8}.card summary{list-style:none;cursor:pointer;padding:15px 16px;display:flex;align-items:center;gap:10px}.card summary::-webkit-details-marker{display:none}.card summary:hover{filter:brightness(.97)}summary:focus-visible{outline:3px solid #8c7650;outline-offset:-3px}.card-main{flex:1;min-width:0}.card-title{font-weight:700;font-size:14px;overflow-wrap:anywhere}.card-sub{font-size:12px;color:#817761;margin-top:6px;line-height:1.5}.arrow{font-size:19px;color:#8d7c5f;transition:transform .15s}details[open] .arrow{transform:rotate(90deg)}.meta{border-top:1px solid #eee7d7;padding:5px 16px 15px}.field{padding-top:10px}.field-label{font-size:12px;color:#8a7c64}.field-value{font-size:13px;line-height:1.6;overflow-wrap:anywhere;margin-top:3px}.empty{font-size:13px;color:#857862;padding:4px 0}.footer{text-align:center;color:#918672;font-size:12px;margin-top:28px}@media(max-width:600px){main{padding:30px 16px 50px}header{padding:16px}h1{font-size:27px}.overview .hint{margin-left:0;width:100%}.lane{padding:17px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* 配色取自用户提供的色卡。 */
:root{color:#482b38;background:#fff9fc}header{background:#fff;border-color:#f8cae4}#message{color:#447a5f}.eyebrow{color:#832d51}.intro,.overview span{color:#714b5e}.overview{background:#f8cae4;border-color:#ea6993}.lane{--lane:#fce9f2;border-color:#ea6993}.lane-count,.footer{color:#775469}.card.status-new{background:#f8cae4;border-color:#ea6993;color:#482438}.card.status-done{background:#cfdd9d;border-color:#447a5f;color:#233d2b}.card.status-working{background:#ea6993;border-color:#832d51;color:#3c1527}.card.status-review{background:#447a5f;border-color:#447a5f;color:#fff}.card.status-blocked{background:#832d51;border-color:#832d51;color:#fff}.card.status-cancelled{background:#f5f0f2;border-color:#bfaab4;color:#51434a}.card-sub,.arrow{color:inherit;opacity:.8}.card.status-review .field-label,.card.status-blocked .field-label{color:#fff;opacity:.8}.card.status-review .meta,.card.status-blocked .meta{border-color:#ffffff70}.badge{background:#fff9;color:#4c2638}.badge.done{background:#447a5f;color:white}.badge.working{background:#832d51;color:white}.badge.review{background:#f8cae4;color:#55213a}.badge.issue{background:#832d51;color:white}.badge.dispute{background:#f8cae4;color:#55213a}
.children{padding:0 12px 14px;display:grid;gap:8px}.children-title{font-size:12px;font-weight:700;opacity:.85;padding:4px 2px}.children .card{box-shadow:0 2px 8px #482b3815}.card .card .field-label{color:inherit;opacity:.8}.card .card .meta{border-color:#832d5140}
/* 嵌套层使用浅底与状态色边线，避免同色块重叠。 */
.cards{align-items:start}.card > .meta{background:#fffafceF;color:#30232a;border-top:1px solid #c8a8b6}.card > .meta .field-label,.card.status-review > .meta .field-label,.card.status-blocked > .meta .field-label{color:#644652;opacity:1;font-weight:600}.card > .meta .field-value{color:#30232a}.children{padding:12px;background:#fffafc;color:#30232a;border-top:1px solid #d8bdc9}.children-title{color:#5d374b;opacity:1}.children > .card,.children > .card.status-new,.children > .card.status-done,.children > .card.status-working,.children > .card.status-review,.children > .card.status-blocked,.children > .card.status-cancelled{background:#fff;color:#30232a;border:1px solid #dacbd1;border-left:5px solid #bcaeb5;box-shadow:0 2px 7px #482b3812}.children > .card.status-new{border-left-color:#ea6993}.children > .card.status-done{border-left-color:#447a5f}.children > .card.status-working{border-left-color:#ea6993}.children > .card.status-review{border-left-color:#447a5f}.children > .card.status-blocked{border-left-color:#832d51}.children > .card.status-cancelled{border-left-color:#9b8f95}.children .card-sub,.children .arrow{color:#614a55;opacity:1}.children .card > .meta{background:#fcf8fa;color:#30232a}.children .card > .meta .field-label{color:#644652;opacity:1}.children .card > .meta .field-value{color:#30232a}
</style></head><body><header><strong>功能进度看板</strong><a href="/planning" style="margin-left:auto;color:#832d51;font-size:14px">项目规划</a><span id="message" role="status">正在连接台账</span></header><main><div class="eyebrow">PROJECT PROGRESS</div><h1>功能执行情况</h1><p class="intro">大功能包含小功能，小功能还可以包含更细的功能点。点击卡片展开详情和下一级。</p><div id="overview" class="overview"></div><div id="board" class="board"></div><p class="footer">台账每 3 秒刷新 · 问题和争议可与开发状态同时存在 · 已取消不计入完成率</p></main>
<script>
let last='';
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function status(i){return i.fields['状态']||(i.checked?'已完成':'未注明状态')}
function present(v){return !!v&&!/^(无|暂无|无问题|无争议|无新增待确认事项|未发现|不适用|没有|—|-|待确认)$/u.test(v.trim())}
function issue(i){return status(i)==='受阻'||present(i.fields['问题'])||present(i.fields['待解决问题'])}
function dispute(i){return present(i.fields['争议'])||present(i.fields['争议事项'])||present(i.fields['争议问题'])}
function render(data){const board=document.getElementById('board'),overview=document.getElementById('overview');const opened=new Set([...document.querySelectorAll('details[open]')].map(d=>d.dataset.key));board.replaceChildren();overview.replaceChildren();const leaves=items=>items.flatMap(i=>i.children&&i.children.length?leaves(i.children):[i]);const all=data.groups.flatMap(g=>leaves(g.items)),valid=all.filter(i=>status(i)!=='已取消'),done=valid.filter(i=>i.checked&&status(i)==='已完成');overview.append(el('strong','',valid.length?Math.round(done.length/valid.length*100)+'%':'—'),el('span','',`已验收 ${done.length} / ${valid.length} 个最细功能点`),el('span','hint','点击任一功能卡片查看详情'));
 for(const g of data.groups){const section=el('section','lane'),head=el('div','lane-head'),active=leaves(g.items).filter(i=>status(i)!=='已取消'),completed=active.filter(i=>status(i)==='已完成'&&i.checked);head.append(el('h2','',g.name),el('span','lane-count',`${g.id} · 已验收 ${completed.length} / ${active.length} 个最细功能点`));section.append(head);const cards=el('div','cards');function makeCard(i){const cardStatus=status(i),cardClass=cardStatus==='已完成'&&i.checked?'done':cardStatus==='进行中'?'working':cardStatus==='待审核'||cardStatus==='已完成'?'review':cardStatus==='受阻'?'blocked':cardStatus==='已取消'?'cancelled':'new';const d=el('details','card status-'+cardClass);d.dataset.key=g.id+':'+i.id;if(opened.has(d.dataset.key))d.open=true;const s=el('summary'),main=el('span','card-main');main.append(el('div','card-title',i.name),el('div','card-sub',i.id));const badges=el('div','badges'),st=status(i),display=st==='已完成'&&!i.checked?'待审核（状态待核实）':st,kind=st==='已完成'&&i.checked?'done':st==='进行中'?'working':st==='待审核'||st==='已完成'?'review':'';badges.append(el('span','badge '+kind,display));if(issue(i))badges.append(el('span','badge issue','有问题'));if(dispute(i))badges.append(el('span','badge dispute','有争议'));main.append(badges);const arrow=el('span','arrow','›');arrow.setAttribute('aria-hidden','true');s.append(main,arrow);d.append(s);const meta=el('div','meta');for(const [k,v] of Object.entries(i.fields)){const f=el('div','field');f.append(el('div','field-label',k),el('div','field-value',v));meta.append(f)}for(const note of i.notes){const f=el('div','field');f.append(el('div','field-value',note));meta.append(f)}if(!meta.children.length)meta.append(el('div','empty','暂无详细信息'));d.append(meta);if(i.children&&i.children.length){const sub=el('div','children');sub.append(el('div','children-title',`包含 ${i.children.length} 个更细的功能点`));for(const child of i.children)sub.append(makeCard(child));d.append(sub)}return d}for(const i of g.items)cards.append(makeCard(i));if(!g.items.length)cards.append(el('div','empty','暂无小功能'));section.append(cards);board.append(section)}if(!data.groups.length)board.prepend(el('p','empty','没有识别到功能分组，请检查台账格式。'))}
async function poll(){try{const r=await fetch('/api/ledger',{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'读取失败');const now=JSON.stringify(data.groups);if(now!==last){render(data);last=now}const m=document.getElementById('message');m.textContent='台账已连接';m.dataset.error='false'}catch(e){const m=document.getElementById('message');m.textContent='连接中断，内容可能过期';m.dataset.error='true'}}poll();setInterval(poll,3000);
</script></body></html>
