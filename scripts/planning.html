<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目规划</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff9fc;color:#382632;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{min-height:62px;flex-wrap:wrap;background:white;border-bottom:1px solid #efc6d9;display:flex;align-items:center;gap:24px;padding:0 max(24px,calc((100vw - 1120px)/2))}header strong{font-size:15px;white-space:nowrap}a{color:#832d51;text-decoration:none;font-size:14px}a:hover{text-decoration:underline}.back{margin-left:auto}main{max-width:1120px;margin:0 auto;padding:42px 24px 60px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:28px;align-items:start}.heading{margin-bottom:26px}h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em}.heading p{margin:0;color:#704e60;font-size:14px;line-height:1.7}.chat{border:1px solid #eab6cd;background:#fff;border-radius:14px;overflow:hidden}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:#fce9f2;border-bottom:1px solid #efd0de;font-size:14px;font-weight:700}.chat-head span{font-size:12px;color:#7b5a69;font-weight:400}#messages{min-height:340px;max-height:58vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}.message{max-width:90%;border-radius:12px;padding:13px 16px;font-size:14px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.message.user{align-self:flex-end;background:#f8cae4;color:#3d2533}.message.assistant{align-self:flex-start;background:#f2f5e8;color:#243b2d}.message .role{font-size:12px;font-weight:700;margin-bottom:4px;opacity:.8}.message .body{white-space:pre-wrap}.welcome{margin:auto;text-align:center;color:#725a66;line-height:1.8;font-size:14px}.welcome strong{font-size:18px;color:#482b38}.composer{border-top:1px solid #f0dae4;padding:16px 20px}textarea{display:block;width:100%;min-height:95px;resize:vertical;border:1px solid #d7bbc8;border-radius:9px;padding:12px;font:inherit;font-size:14px;line-height:1.6;color:#382632}textarea:focus{outline:2px solid #ea6993;outline-offset:2px}.actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}button{cursor:pointer;font:inherit;border:0;border-radius:8px;padding:10px 15px}.send{background:#832d51;color:white;font-weight:700}.secondary{background:#f9eaf1;color:#71354f}.controls{display:flex;gap:8px;flex-wrap:wrap}.status{color:#745867;font-size:12px}.status.error{color:#a32645}.side{border:1px solid #e5cfda;border-radius:12px;padding:20px;background:#fff}.side h2{font-size:15px;margin:0 0 15px}.side p,.side li{font-size:13px;line-height:1.75;color:#6e5360}.side ol{padding-left:20px;margin:0}.side li+li{margin-top:9px}.side hr{border:0;border-top:1px solid #f1e4ea;margin:18px 0}.side strong{color:#3b2932}.plan-document{margin:0 0 26px;border:1px solid #eab6cd;border-radius:14px;background:#fff;overflow:hidden}.plan-document[hidden]{display:none}.plan-header{padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fce9f2;border-bottom:1px solid #efd0de}.plan-header h2{margin:0;font-size:18px}.plan-header p{margin:0;color:#745867;font-size:12px;overflow-wrap:anywhere}.plan-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.plan-content{padding:24px;line-height:1.8;overflow-wrap:anywhere}.plan-content h1,.plan-content h2,.plan-content h3{margin:1.2em 0 .4em;color:#482b38}.plan-content h1{font-size:23px}.plan-content h2{font-size:18px}.plan-content h3{font-size:16px}.plan-content p{margin:.45em 0;white-space:pre-wrap}.plan-content ul{padding-left:1.4em}.plan-content li{margin:.3em 0}.plan-content pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f8f3f5;padding:12px;border-radius:8px}button:disabled{opacity:.55;cursor:wait}@media(max-width:760px){main{padding:28px 16px}.layout{grid-template-columns:1fr}.side{order:-1}.message{max-width:100%}header{padding:0 16px}h1{font-size:26px}}
</style></head><body><header><strong>项目管理器</strong><a href="/projects">项目总览</a><a class="back" href="/">返回功能看板</a></header><main><div class="heading"><h1 id="project-title">项目规划</h1><p>从一个想法开始，和智能体逐步讨论需求、拆分功能，并整理验收标准。</p></div><section id="plan-document" class="plan-document" aria-label="项目规划书" hidden><div class="plan-header"><div><h2>项目规划书</h2><p><span id="plan-sync">正在读取项目规划书…</span></p></div><div class="plan-actions"><button class="secondary" type="button" id="save-plan">保存规划书</button><button class="secondary" type="button" id="reload-plan">读取文件版本</button><button class="secondary" type="button" id="copy-plan">复制规划书</button><button class="secondary" type="button" id="download-plan">下载 Markdown</button></div></div><article id="plan-content" class="plan-content"></article></section><div class="layout"><section class="chat" aria-label="项目规划对话"><div class="chat-head">规划对话 <span>由本机 Codex 提供回复</span></div><div id="messages" aria-live="polite"></div><form id="form" class="composer"><textarea id="input" placeholder="例如：我想做一个管理个人待办事项的小工具……" aria-label="输入项目想法" required></textarea><div class="actions"><span id="status" class="status">对话保存在当前浏览器中</span><div class="controls"><button class="secondary" id="draft" type="button">完成对话，生成规划书</button><button class="secondary" id="generate-ledger" type="button">生成功能台账</button><button class="secondary" id="save-ledger" type="button">保存到看板</button><button class="secondary" id="copy" type="button">复制对话</button><button class="secondary" id="clear" type="button">清空对话</button><button class="send" type="submit">发送</button></div></div></form></section><aside class="side"><h2>一起梳理项目</h2><ol><li>说明目标、使用者和主要场景。</li><li>通过对话澄清范围、约束和未确定事项。</li><li>拆分可验收功能，梳理依赖、风险和优先级。</li><li>完成对话后生成并审阅项目规划书。</li><li>生成并审阅功能台账，然后保存到看板。</li></ol><hr><p><strong>当前是规划草稿。</strong>生成的规划书会保存为项目目录内的 Markdown。功能台账需审阅并确认后保存；AI 修改文件后，页面会自动同步。</p></aside></div></main><script>
const TOKEN='__PLANNING_TOKEN__',KEY='project-planning:__PLANNING_KEY__',PLAN_KEY=KEY+':document',DRAFT_KEY=KEY+':document-draft-v2';
const project=new URLSearchParams(location.search).get('project');
const api=path=>path+(project?'?project='+encodeURIComponent(project):'');
document.querySelector('.back').href=api('/');
let messages=[],planText='',planRequested=false,busy=false,dirty=false,planRevision=null,planPath='',planPolling=false;
try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))messages=saved.filter(m=>m&&['user','assistant'].includes(m.role)&&typeof m.content==='string')}catch(e){}
const list=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input'),status=document.getElementById('status'),send=form.querySelector('.send'),planSync=document.getElementById('plan-sync');
function notice(text,error=false){status.className='status'+(error?' error':'');status.textContent=text}
function saveChat(){try{localStorage.setItem(KEY,JSON.stringify(messages))}catch(e){notice('对话无法保存在浏览器，请及时复制。',true)}}
async function request(path,payload){const r=await fetch(api(path),payload===undefined?{cache:'no-store'}:{method:'POST',headers:{'Content-Type':'application/json','X-Planning-Token':TOKEN},body:JSON.stringify(payload)});let data;try{data=await r.json()}catch(e){throw Error(r.status===403?'页面连接已失效，请保留输入文字后刷新页面。':'服务返回无效内容。')}if(!r.ok)throw Error(data.error||'操作失败');return data}
function setBusy(value){busy=value;for(const id of ['draft','generate-ledger','save-ledger','clear','save-plan','reload-plan'])document.getElementById(id).disabled=value;send.disabled=value;input.disabled=value}
function renderChat(){list.replaceChildren();if(!messages.length){const w=document.createElement('div');w.className='welcome';w.textContent='先聊聊你的想法，我们可以边聊边整理。';list.append(w);return}for(const m of messages){const box=document.createElement('div'),role=document.createElement('div'),body=document.createElement('div');box.className='message '+m.role;role.className='role';role.textContent=m.role==='user'?'你':'规划助手';body.className='body';body.textContent=m.content;box.append(role,body);list.append(box)}list.scrollTop=list.scrollHeight}
function retainDraft(){try{localStorage.setItem(DRAFT_KEY,JSON.stringify({content:planText,revision:planRevision}))}catch(e){notice('规划书尚未写入文件，请复制或下载保留。',true)}}
async function loadPlan(force=false){if(planPolling||busy||dirty&&!force)return;planPolling=true;try{const data=await request('/api/plan');if(data.revision!==planRevision||force){planRevision=data.revision;planPath=data.path;dirty=false;showPlan(data.content);planSync.textContent='文件已同步：'+planPath}return data}catch(e){planSync.textContent='文件同步失败：'+e.message;notice(e.message,true);throw e}finally{planPolling=false}}
async function savePlan(){if(planRevision===null)throw Error('尚未读取文件版本，请先读取文件后再生成。');const data=await request('/api/plan/save',{content:planText,revision:planRevision});planRevision=data.revision;planPath=data.path||planPath;dirty=false;try{localStorage.removeItem(PLAN_KEY);localStorage.removeItem(DRAFT_KEY)}catch(e){}planSync.textContent='已保存到 Markdown：'+planPath;return data}
renderChat();
(async()=>{try{const data=await loadPlan();let draft=null;try{draft=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(!draft){const legacy=localStorage.getItem(PLAN_KEY);if(legacy)draft={content:legacy,revision:data.content?null:data.revision}}}catch(e){}if(draft&&typeof draft.content==='string'&&draft.content!==data.content){showPlan(draft.content);planRevision=typeof draft.revision==='string'?draft.revision:null;dirty=true;planSync.textContent='发现未保存草稿；保留原文件版本校验。可复制或下载保留，或读取文件版本。'}if(project){const data=await request('/api/projects');const p=data.projects.find(p=>p.id===project);if(p)document.getElementById('project-title').textContent=p.name+' · 项目规划'}}catch(e){}})();
setInterval(()=>loadPlan().catch(()=>{}),3000);
form.addEventListener('submit',async e=>{e.preventDefault();const value=input.value.trim();if(!value||busy)return;const generatingPlan=planRequested;planRequested=false;let added=false;setBusy(true);try{if(generatingPlan){if(dirty)throw Error('请先保存或下载当前规划书草稿，再读取文件版本。');const current=await request('/api/plan');planRevision=current.revision;planPath=current.path;showPlan(current.content)}const ledgerBase=await request('/api/ledger/info');messages.push({role:'user',content:value});added=true;input.value='';saveChat();renderChat();notice('智能体正在思考，请稍候…');const data=await request('/api/planning',{messages});messages.push({role:'assistant',content:data.reply,ledgerRevision:ledgerBase.revision});saveChat();renderChat();if(generatingPlan){showPlan(data.reply,true);dirty=true;retainDraft();try{await savePlan();notice('规划书已生成并保存到项目目录。')}catch(e){planSync.textContent='规划书未保存：'+e.message;notice('规划书已生成，文件保存失败：'+e.message,true)}}else notice('对话已保存，项目文件会作为下一轮规划的参考。')}catch(e){if(added){messages.pop();saveChat();renderChat();input.value=value}notice(e.message,true)}finally{setBusy(false)}});
document.getElementById('draft').addEventListener('click',()=>{if(!messages.length){notice('请先描述项目想法，再生成规划书。',true);input.focus();return}planRequested=true;input.value='请结合已有对话与当前项目文件，生成完整的 Markdown 项目规划书：包含目标、用户场景、范围与不做事项、分层功能及验收标准、优先级与依赖、风险与待确认事项、必要的阶段安排。区分确认内容与假设，不编造工期。';form.requestSubmit()});
document.getElementById('generate-ledger').addEventListener('click',()=>{if(!messages.length&&!planText){notice('请先描述项目想法或保存规划书。',true);return}input.value='请根据当前项目规划书和已有对话输出可直接保存的 Markdown 功能台账。包括大功能、小功能和更细功能；逐项写状态、验收、优先级、依赖、执行 Agent、实现证据、审核 Agent、评分和问题。不使用代码围栏，未审核项不勾选，保留未确认事项及现有实现与审核历史。';form.requestSubmit()});
document.getElementById('save-plan').addEventListener('click',async()=>{if(!planText)return;setBusy(true);try{await savePlan();notice('规划书已保存到 '+planPath)}catch(e){notice(e.message,true)}finally{setBusy(false)}});
document.getElementById('reload-plan').addEventListener('click',async()=>{if(dirty&&!confirm('当前有未保存的规划书草稿，读取文件版本会替换页面内容。请先复制或下载保留。继续吗？'))return;try{await loadPlan(true);try{localStorage.removeItem(PLAN_KEY);localStorage.removeItem(DRAFT_KEY)}catch(e){}notice('已读取项目文件中的规划书。')}catch(e){}});
document.getElementById('save-ledger').addEventListener('click',async()=>{const candidate=[...messages].reverse().find(m=>m.role==='assistant'&&/^##\s+大功能\s+/m.test(m.content));if(!candidate){notice('请先生成并审阅功能台账。',true);return}if(typeof candidate.ledgerRevision!=='string'){notice('这份旧台账草稿没有文件版本记录，请基于最新项目文件重新生成后保存。',true);return}let content=candidate.content;const fenced=content.match(/```(?:markdown|md)?\s*\n([\s\S]*?)```/i);if(fenced&&/^##\s+大功能\s+/m.test(fenced[1]))content=fenced[1];setBusy(true);try{const meta=await request('/api/ledger/info');if(meta.revision!==candidate.ledgerRevision)throw Error('生成后台账文件已更新，请基于最新项目文件重新生成，避免覆盖进度。');if(!confirm('保存到当前项目：\n'+meta.path+'\n\n将替换台账并保留备份。请确认实现与审核历史已保留。'))return;const data=await request('/api/ledger/save',{content,revision:candidate.ledgerRevision});notice('已保存 '+data.count+' 个功能点。返回看板查看；原文件已备份。')}catch(e){notice(e.message,true)}finally{setBusy(false)}});
document.getElementById('clear').addEventListener('click',()=>{if(messages.length&&!confirm('清空当前项目在本浏览器中的对话？项目 Markdown 文件保持原样。'))return;messages=[];saveChat();renderChat();notice('对话已清空。')});
document.getElementById('copy-plan').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(planText);notice('已复制规划书')}catch(e){notice('复制失败，请选择文字手动复制。',true)}});
document.getElementById('download-plan').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([planText],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='项目规划书.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(messages.map(m=>(m.role==='user'?'你':'规划助手')+'：\n'+m.content).join('\n\n'));notice('已复制对话')}catch(e){notice('复制失败，请手动选择文字。',true)}});

function showPlan(text,scroll=false){planText=text;const section=document.getElementById('plan-document'),article=document.getElementById('plan-content');section.hidden=!text;article.replaceChildren();if(!text)return;let listNode=null,inCode=false,codeNode=null;for(const line of text.split('\n')){if(/^\s*```/.test(line)){inCode=!inCode;if(inCode){codeNode=document.createElement('pre');article.append(codeNode)}else codeNode=null;listNode=null;continue}if(inCode){codeNode.textContent+=line+'\n';continue}const heading=line.match(/^(#{1,3})\s+(.+)/),bullet=line.match(/^\s*[-*]\s+(.+)/);if(heading){const h=document.createElement('h'+heading[1].length);h.textContent=heading[2].replace(/\*\*/g,'');article.append(h);listNode=null}else if(bullet){if(!listNode){listNode=document.createElement('ul');article.append(listNode)}const li=document.createElement('li');li.textContent=bullet[1].replace(/\*\*/g,'');listNode.append(li)}else{listNode=null;if(!line.trim())continue;const p=document.createElement('p');p.textContent=line.replace(/\*\*/g,'');article.append(p)}}if(scroll)section.scrollIntoView({behavior:'smooth',block:'start'})}
</script></body></html>
