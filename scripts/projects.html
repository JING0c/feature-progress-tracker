<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>项目管理器</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#382632;background:#fff9fc;--ink:#382632;--muted:#705664;--pink:#ea6993;--magenta:#832d51;--pale:#f8cae4;--tea:#cfdd9d;--green:#447a5f}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a,input{touch-action:manipulation}button{cursor:pointer}a{color:var(--magenta);text-decoration:none}a:hover{text-decoration:underline}:focus-visible{outline:3px solid var(--pink);outline-offset:3px}header{background:#fff;border-bottom:1px solid #efc6d9;padding:18px max(24px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:14px}header{flex-wrap:wrap}header strong{font-size:15px;white-space:nowrap}header nav{display:flex;gap:20px;margin-right:auto}header a[aria-current=page]{font-weight:700;color:#382632}#sync-status{color:var(--green);font-size:13px}#sync-status[data-error=true]{color:var(--magenta)}main{max-width:1120px;margin:auto;padding:42px 24px 70px}.intro{display:flex;gap:24px;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:30px;margin:0 0 10px;letter-spacing:-.02em}.intro p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}.primary,.secondary{border:0;border-radius:8px;padding:11px 16px;white-space:nowrap}.primary{background:var(--magenta);color:#fff;font-weight:650}.secondary{background:#f9eaf1;color:var(--magenta)}button:disabled{opacity:.55;cursor:wait}.summary{display:grid;grid-template-columns:repeat(4,1fr);background:#fce9f2;border:1px solid #eab6cd;border-radius:14px;padding:20px 24px;gap:20px;margin-bottom:26px}.summary-value{font-size:26px;font-weight:700;color:#4a2739}.summary-label{font-size:13px;color:var(--muted);margin-top:5px}.summary-note{grid-column:1/-1;font-size:12px;color:var(--muted);margin:0}.project-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}.project{background:#fff;border:1px solid #e4bdcf;border-radius:14px;overflow:hidden;min-width:0}.project-head{padding:21px 22px 18px;background:#fceef4;border-bottom:1px solid #efdae4;display:flex;gap:16px;align-items:start}.project-name{margin:0;font-size:18px;line-height:1.4;overflow-wrap:anywhere}.project-dir{font-size:12px;color:var(--muted);margin:8px 0 0;overflow-wrap:anywhere;line-height:1.6}.project-body{padding:19px 22px 22px}.project-progress{display:flex;align-items:baseline;gap:10px;margin:0 0 12px}.project-progress strong{font-size:24px}.project-progress span{font-size:13px;color:var(--muted)}.track{height:6px;border-radius:4px;background:#f0e7ec;overflow:hidden;margin-bottom:18px}.fill{height:100%;background:var(--green)}.counts{display:flex;gap:7px;flex-wrap:wrap;min-height:26px}.count{font-size:12px;line-height:1.5;padding:5px 9px;border-radius:6px;background:#f8f0f4;color:#5d3d4c}.count.working{background:#f8cae4;color:#542339}.count.review{background:#e6ede5;color:#31533f}.count.blocked{background:#832d51;color:white}.count.done{background:#cfdd9d;color:#294333}.attention{margin:14px 0 0;font-size:13px;color:#832d51;line-height:1.6}.project-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}.project-links{display:flex;gap:14px;font-size:14px;font-weight:650}.updated{font-size:11px;color:#79626d}.error{background:#fff1f5;border:1px solid #e8b4c7;color:#832d51;border-radius:8px;padding:12px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}.empty{padding:42px 24px;text-align:center;border:1px dashed #dfb0c5;border-radius:12px;background:#fff;color:var(--muted);grid-column:1/-1}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:10px}.empty p{font-size:14px;line-height:1.7}.add-project{margin-bottom:26px;border:1px solid #eab6cd;border-radius:14px;background:#fff;padding:23px}.add-project[hidden]{display:none}.form-top{display:flex;justify-content:space-between;align-items:center;gap:16px}.form-top h2{font-size:18px;margin:0}.form-description{font-size:13px;color:var(--muted);line-height:1.7;margin:12px 0 20px}.form-grid{display:grid;grid-template-columns:1fr 1.5fr;gap:17px}.form-field{display:flex;flex-direction:column;gap:7px;min-width:0}.form-field.wide{grid-column:1/-1}label{font-size:13px;font-weight:650}input{border:1px solid #ceb4c0;border-radius:7px;padding:10px 11px;background:#fff;color:var(--ink);width:100%}.help{font-size:12px;color:var(--muted);line-height:1.6}.form-actions{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-top:19px}.form-message{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.form-message[data-error=true]{color:var(--magenta)}.footer{font-size:12px;color:#79626d;line-height:1.8;margin-top:28px;text-align:center;overflow-wrap:anywhere}@media(max-width:650px){main{padding:28px 16px 48px}header{padding:16px;align-items:center;gap:14px}header nav{order:3;width:100%;gap:18px}.intro{align-items:start;flex-direction:column;gap:16px}h1{font-size:26px}.summary{grid-template-columns:repeat(2,1fr);padding:18px;gap:20px}.form-grid{grid-template-columns:1fr}.form-field.wide{grid-column:auto}.project-head,.project-body{padding:18px}.form-actions{align-items:start;flex-direction:column}.add-project{padding:18px}}
.project-mode{border:0;padding:0;margin:0 0 21px;display:flex;gap:10px;flex-wrap:wrap}.project-mode legend{font-size:13px;font-weight:650;margin-bottom:9px}.mode-choice{display:flex;align-items:center;gap:8px;cursor:pointer;border:1px solid #dfc2d0;border-radius:8px;padding:10px 15px;background:#fff9fc}.mode-choice:has(input:checked){background:#fce9f2;border-color:#832d51;color:#63253f}.mode-choice input{width:auto;padding:0;margin:0;accent-color:#832d51}.form-field[hidden]{display:none}.planning-state{margin:0 0 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.planning-state strong{font-size:19px;color:#71354f}.source-label{font-size:11px;color:#705664;background:#f6edf2;padding:4px 7px;border-radius:5px}.planning-reason{margin:0;color:#705664;line-height:1.75;font-size:14px}.planning-next{font-size:12px;color:#79626d;line-height:1.7;margin:10px 0 0}
</style>
</head>
<body>
<header><strong>项目管理器</strong><nav aria-label="项目导航"><a href="/projects" aria-current="page">项目总览</a></nav><span id="sync-status" role="status">正在读取项目</span></header>
<main>
<div class="intro"><div><h1>所有项目，一起掌握</h1><p>在 Codex 或 Claude Code 对话中管理项目；此处查看已保存内容。</p></div></div>
<section id="summary" class="summary" aria-label="全部项目概况"></section>
<div id="project-list" class="project-list" aria-label="项目列表"></div>
<p class="footer">每 3 秒读取 Markdown 文件变化，AI 更新文件后会自动显示。<br><span id="workspace-path"></span></p>
</main>
<script>
let lastPayload='',lastSuccess=null,pollTimer=null,polling=false;
const projectList=document.getElementById('project-list'),summary=document.getElementById('summary'),sync=document.getElementById('sync-status');
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function projectUrl(path,id){return path+'?project='+encodeURIComponent(id)}
function isReady(project){return project.planning?.ready===true}
function number(value){return typeof value==='number'&&Number.isFinite(value)?Math.max(0,value):0}
function timeLabel(value){if(!value)return '尚无更新时间';const date=new Date(typeof value==='number'&&value<1e12?value*1000:value);return Number.isNaN(date.getTime())?'更新时间未知':date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function render(data){
 const projects=data.projects,pending=projects.filter(p=>!isReady(p)),readable=projects.filter(p=>isReady(p)&&!p.error&&p.summary),failed=projects.filter(p=>p.error),sum=key=>readable.reduce((n,p)=>n+number(p.summary[key]),0);summary.replaceChildren();
 for(const [value,label] of [[projects.length,'管理中的项目'],[sum('working'),'正在开发的功能'],[sum('review'),'等待审核的功能'],[sum('blocked'),'受阻的功能']]){const block=el('div');block.append(el('div','summary-value',String(value)),el('div','summary-label',label));summary.append(block)}
 const notes=[];
 if(pending.length)notes.push(`${pending.length} 个项目待规划，完成项目规划书后纳入功能统计。`);
 if(failed.length)notes.push(`${failed.length} 个项目读取失败，功能统计暂不包含这些项目。`);
 notes.push('功能统计按最细功能点计算；已取消项不计入完成率。');
 summary.append(el('p','summary-note',notes.join(' ')));
 // Do not replace cards when only the clock changes.
 projectList.replaceChildren();
 if(!projects.length){const empty=el('div','empty');empty.append(el('strong','','还没有项目'),el('p','','请在 Codex 或 Claude Code 对话中说“新建项目”或“导入项目”，完成规划后会在这里显示。'));projectList.append(empty)}
 for(const project of projects){const card=el('section','project'),head=el('div','project-head'),body=el('div','project-body'),title=el('h2','project-name',project.name||'未命名项目');head.append(title);const titleWrap=el('div');titleWrap.append(title,el('p','project-dir',project.directory||''));head.replaceChildren(titleWrap);card.append(head);
  const ready=isReady(project);
  if(!ready){const state=el('p','planning-state');state.append(el('strong','','待规划'));if(['new','import'].includes(project.source))state.append(el('span','source-label',project.source==='import'?'导入项目':'新建项目'));body.append(state,el('p','planning-reason',project.planning?.reason||'请先生成并保存项目规划书。'),el('p','planning-next','在 Codex 或 Claude Code 中完成并保存规划书，再生成功能台账。'));if(project.error)body.append(el('div','error','项目资料读取异常：'+project.error))}
  else if(project.error||!project.summary){body.append(el('div','error','无法读取此项目：'+(project.error||'暂时无法读取功能进度，请稍后重试。')))}
  else{const stats=project.summary,total=number(stats.total),done=number(stats.done),pct=total?Math.round(done/total*100):0,progress=el('p','project-progress');progress.append(el('strong','',total?pct+'%':'—'),el('span','',total?`已验收 ${done} / ${total} 个功能点`:'规划书已就绪，可继续生成功能台账'));body.append(progress);const track=el('div','track'),fill=el('div','fill');fill.style.width=Math.min(100,pct)+'%';track.append(fill);body.append(track);const counts=el('div','counts');for(const [key,label,cls] of [['working','开发中','working'],['review','待审核','review'],['blocked','受阻','blocked'],['done','已完成','done']])counts.append(el('span','count '+cls,label+' '+number(stats[key])));body.append(counts);const issues=number(stats.issues),disputes=number(stats.disputes);if(issues||disputes)body.append(el('p','attention',`${issues} 个功能有待解决问题 · ${disputes} 个功能有争议`))}
  const footer=el('div','project-footer'),links=el('div','project-links'),planning=el('a','','查看规划');planning.href=projectUrl('/planning',project.id);if(ready){const board=el('a','','查看看板');board.href=projectUrl('/',project.id);links.append(board)}links.append(planning);footer.append(links,el('span','updated','文件更新 '+timeLabel(project.updated_at)));body.append(footer);card.append(body);projectList.append(card)
 }
 document.getElementById('workspace-path').textContent=data.workspace?'项目清单目录：'+data.workspace:'当前为单项目查看模式。';
}
async function poll(){if(polling)return;polling=true;try{const res=await fetch('/api/projects',{cache:'no-store'}),data=await res.json();if(!res.ok)throw Error(data.error||'无法读取项目清单');if(!Array.isArray(data.projects))throw Error('项目清单格式无效');const current=JSON.stringify(data);if(current!==lastPayload){render(data);lastPayload=current}lastSuccess=new Date();sync.dataset.error='false';sync.textContent='已同步 · '+lastSuccess.toLocaleTimeString('zh-CN',{hour12:false})}catch(error){sync.dataset.error='true';sync.textContent=lastSuccess?'同步中断，显示上次读取结果':'无法读取项目，请检查服务';if(!lastPayload){summary.replaceChildren();projectList.replaceChildren(el('div','error',error.message||'读取失败'))}}finally{polling=false;if(pollTimer)clearTimeout(pollTimer);pollTimer=setTimeout(poll,3000)}}

poll();
</script>
</body></html>
